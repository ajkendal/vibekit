  <head>

    <link rel="apple-touch-icon" href="/brand/VibeKit_Logo.png" />
    <meta name="theme-color" content="#FAF7F2" />

    <title>VibeKit — theme builder</title>

    <!-- SEO -->
    <link rel="canonical" href="https://vibekit.studio/" />

      property="og:description"
      content="Craft your design system in the browser. Export to CSS, Tailwind, Design Tokens JSON, or SCSS. Live web + mobile previews and WCAG contrast validation built in."

    <meta property="og:image:secure_url" content="https://vibekit.studio/brand/og-image.png" />

      name="twitter:title"
