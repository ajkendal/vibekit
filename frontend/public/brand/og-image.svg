<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FAF7F2"/>

  <!-- Subtle decorative chips (top-right corner) -->
  <g opacity="0.15">
    <rect x="1060" y="60" width="24" height="100" rx="5" fill="#FFBE0B"/>
    <rect x="1090" y="40" width="24" height="120" rx="5" fill="#FB5607"/>
    <rect x="1120" y="50" width="24" height="110" rx="5" fill="#FF006E"/>
  </g>

  <!-- Wave mark (centered, large) -->
  <g transform="translate(500, 100)">
    <rect x="0"   y="40" width="32" height="160" rx="7" fill="#FFBE0B"/>
    <rect x="40"  y="20" width="32" height="160" rx="7" fill="#FB5607"/>
    <rect x="80"  y="0"  width="32" height="160" rx="7" fill="#FF006E"/>
    <rect x="120" y="20" width="32" height="160" rx="7" fill="#8338EC"/>
    <rect x="160" y="40" width="32" height="160" rx="7" fill="#3A86FF"/>
  </g>

  <!-- Wordmark — Lato Black at 96px -->
  <text x="600" y="400"
        text-anchor="middle"
        font-family="Lato"
        font-weight="900"
        font-size="96"
        fill="#1A1A1A">VibeKit</text>

  <!-- Tagline — Lato Medium at 26px -->
  <text x="600" y="450"
        text-anchor="middle"
        font-family="Lato"
        font-weight="500"
        font-size="26"
        fill="#1A1A1A"
        fill-opacity="0.65">Theme design toolkit · multi-format token exports</text>

  <!-- Color row pills (centered) -->
  <g transform="translate(456, 522)">
    <rect x="0"   width="56" height="12" rx="6" fill="#FFBE0B"/>
    <rect x="72"  width="56" height="12" rx="6" fill="#FB5607"/>
    <rect x="144" width="56" height="12" rx="6" fill="#FF006E"/>
    <rect x="216" width="56" height="12" rx="6" fill="#8338EC"/>
    <rect x="288" width="56" height="12" rx="6" fill="#3A86FF"/>
  </g>

  <!-- Bottom URL label -->
  <text x="600" y="580"
        text-anchor="middle"
        font-family="Lato"
        font-weight="700"
        font-size="14"
        fill="#1A1A1A"
        fill-opacity="0.4"
        letter-spacing="2">VIBEKIT.STUDIO</text>
</svg>
